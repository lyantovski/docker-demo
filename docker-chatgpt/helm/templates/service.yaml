apiVersion: v1
kind: Service
metadata:
  name: {{ include "gemini-chat.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gemini-chat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gemini-chat.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
