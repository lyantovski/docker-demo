apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gemini-chat.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gemini-chat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gemini-chat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gemini-chat.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.container.port }}
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "gemini-chat.fullname" . }}-secret
              key: GEMINI_API_KEY
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
