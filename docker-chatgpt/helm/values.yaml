replicaCount: 1

image:
  repository: acrliorsc.azurecr.io/openai-k8s
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

container:
  port: 5000

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

geminiApiKey: "YOUR-GEMINI-API-KEY"

namespace: gemini-chat-new

createNamespace: false
